name: Mise à jour des offres

on:
  schedule:
    - cron: "23 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  offres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les offres
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/fetch.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/offres.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Offres du $(date -u +%Y-%m-%d)"
            git push
          fi
